<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>SYNC — sing-off</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffe600'/><text y='.9em' x='50' text-anchor='middle' font-size='78' font-family='Impact,sans-serif' fill='%2308070c'>S</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="stage" style="justify-content:center;align-items:center;text-align:center;gap:clamp(18px,3vmin,40px)">

  <div>
    <div class="label" style="margin-bottom:.7em">Two phones. One song. No mercy.</div>
    <h1 class="d1" style="letter-spacing:.02em">SY<span class="acid">N</span>C</h1>
    <p class="muted" style="max-width:34ch;margin:14px auto 0;font-size:15px;line-height:1.5">
      The laptop plays a song. Everyone sings into their phone.
      Whoever gets the most words right takes the point.
    </p>
  </div>

  <div class="row" style="justify-content:center;gap:16px;flex-wrap:wrap">
    <a class="btn" href="/host.html" style="border:2px solid var(--acid);background:var(--acid);color:var(--ink);padding:20px 34px;text-decoration:none;letter-spacing:.24em">
      Host on this screen
    </a>
  </div>

  <form id="joinForm" class="panel stack" style="padding:22px;width:min(380px,92vw);gap:14px">
    <div class="label">Singing? Enter the code</div>
    <input id="code" inputmode="text" autocapitalize="characters" autocomplete="off"
           maxlength="4" placeholder="XXXX"
           style="font-family:var(--display);font-size:44px;text-align:center;letter-spacing:.3em;padding:10px">
    <input id="name" maxlength="14" placeholder="Your name" autocomplete="off">
    <button class="primary" type="submit">Join the sing-off</button>
    <div id="err" class="label" style="color:var(--p1);min-height:1.2em"></div>
  </form>

  <div class="label" style="opacity:.6">Chrome on Android · Safari on iOS · headphones off, speakers up</div>
</main>

<script type="module">
  import { $ } from '/lib.js';
  const code = $('#code'), name = $('#name'), err = $('#err');
  name.value = localStorage.getItem('sync:name') || '';
  const pre = new URLSearchParams(location.search).get('code');
  if (pre) code.value = pre.toUpperCase();
  code.addEventListener('input', () => {
    code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    err.textContent = '';
  });
  $('#joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const c = code.value.trim();
    if (c.length !== 4) return (err.textContent = 'Four characters');
    if (!name.value.trim()) return (err.textContent = 'Need a name');
    const res = await fetch('/api/room/' + c).catch(() => null);
    if (!res || !res.ok) return (err.textContent = 'No room with that code');
    localStorage.setItem('sync:name', name.value.trim());
    location.href = `/play.html?code=${c}&name=${encodeURIComponent(name.value.trim())}`;
  });
</script>
</body>
</html>
