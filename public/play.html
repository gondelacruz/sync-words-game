<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08070c">
<title>SYNC</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffe600'/><text y='.9em' x='50' text-anchor='middle' font-size='78' font-family='Impact,sans-serif' fill='%2308070c'>S</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="stage phone">

  <header class="row" style="justify-content:space-between;flex:0 0 auto">
    <div class="brand" style="font-size:22px">SY<em>N</em>C</div>
    <div class="row" style="gap:8px">
      <span id="roomChip" class="chip">—</span>
      <span id="ptsChip" class="chip hot">0</span>
    </div>
  </header>

  <!-- ARM MIC -->
  <section id="armMic" class="stack center" style="flex:1 1 auto;justify-content:center;gap:22px">
    <div class="d2" id="hiName">—</div>
    <p class="muted" style="max-width:28ch;margin:0 auto;font-size:15px;line-height:1.6">
      Tap once to hand over the microphone. Then hold the phone close to your mouth and
      <span class="acid">sing loud</span>.
    </p>
    <button id="armBtn" class="primary huge">Arm my mic</button>
    <div id="micErr" class="label" style="color:var(--p1);max-width:30ch;margin:0 auto"></div>
  </section>

  <!-- WAITING -->
  <section id="waiting" class="stack center hide" style="flex:1 1 auto;justify-content:center;gap:18px">
    <div class="mic"><span class="ring on"></span><span class="label">Mic live</span></div>
    <div class="d2" id="waitTitle">Waiting for the host</div>
    <div class="muted" id="waitSub" style="font-size:15px">Look at the big screen.</div>
    <div id="board" class="stack" style="gap:6px;width:min(340px,90vw);margin:10px auto 0"></div>
  </section>

  <!-- SINGING -->
  <section id="singing" class="stack hide" style="flex:1 1 auto;min-height:0;gap:14px">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <span class="label">Sing!</span>
      <span class="d3 acid" id="pClock" style="font-variant-numeric:tabular-nums">0:00</span>
    </div>
    <div class="bigmeter" id="meter" style="flex:0 0 34vh">
      <div class="fill" id="meterFill"></div>
      <div class="num" id="meterNum">0</div>
    </div>
    <div id="wordsHint" class="label center">Nothing heard yet — get the phone to your mouth</div>
    <div id="words" class="words scroll"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="stack center hide" style="flex:1 1 auto;justify-content:center;gap:16px">
    <div id="resStamp" class="stamp" style="align-self:center">—</div>
    <div class="d2" id="resPct">0%</div>
    <div class="label" id="resDetail">—</div>
    <div class="muted" style="font-size:14px">Waiting for the next song…</div>
  </section>
</main>
<script type="module" src="/play.js"></script>
</body>
</html>
