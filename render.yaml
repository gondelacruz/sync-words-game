services:
  - type: web
    name: sync-lyrics-game-39ew          # <-- this sets your URL: https://<name>.onrender.com
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false           # YouTube Data API v3 key (Google Cloud). Without it the host pastes links.
      # REVERT TO SPOTIFY: add MUSIC_SOURCE=spotify in Render's Environment tab (see README).
      - key: SPOTIFY_CLIENT_ID
        sync: false           # only needed if MUSIC_SOURCE=spotify (kept for rollback)
      - key: GROQ_API_KEY
        sync: false           # speech-to-text; add the value in the Render dashboard
