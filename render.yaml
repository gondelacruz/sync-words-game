services:
  - type: web
    name: sync-lyrics-game-39ew          # <-- this sets your URL: https://<name>.onrender.com
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false           # prompted for on first deploy, never stored in git
      - key: GROQ_API_KEY
        sync: false           # speech-to-text; add the value in the Render dashboard
